name: Bug 报告
description: 播放异常、闪退、导入失败等可以复现的问题
title: "[Bug] "
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！信息填得越完整，问题修得越快。

        提交前请先：
        1. 搜索[已有 Issue](https://github.com/cq10086123/Timbre/issues?q=is%3Aissue)，避免重复；
        2. 升级到[最新版本](https://github.com/cq10086123/Timbre/releases/latest)，确认问题依然存在。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？你原本期望发生什么？
      placeholder: |
        例如：播放到第 37 章时声音消失，但进度条还在走、时间还在累加；
        期望是声音正常播完这一章。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步一步写清楚，能稳定复现的问题优先修
      placeholder: |
        1. 打开 App，进入书架
        2. 点开《书名》
        3. 播放并切换到第 37 章
        4. 声音消失，进度条继续走
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 涉及功能
      description: 问题出现在哪个功能上？选最接近的一项
      options:
        - 本地文件（导入 / 扫描 / 书架）
        - 播放（进度 / 后台播放 / 通知栏）
        - WebDAV 或 NAS 在线播放
        - 在线书源
        - 自定义接口源（.jdr 扩展包）
        - 下载与缓存
        - 界面 / 主题 / 语言
        - 应用闪退（直接退出）
        - 其他
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 复现频率
      options:
        - 每次都能复现
        - 偶尔出现
        - 只出现过一次
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Timbre 版本
      description: 在「设置 → 软件版本」里查看，例如 3.2.523
      placeholder: "3.2.523"
    validations:
      required: true

  - type: dropdown
    id: install-source
    attributes:
      label: 安装来源
      options:
        - GitHub Releases 下载的 APK
        - 自行编译
        - 其他渠道
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android 版本
      placeholder: "Android 14"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备型号
      placeholder: "小米 14 / 华为 MatePad 11 / MuMu 模拟器"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: |
        闪退类问题请尽量附上日志：手机连电脑后执行 `adb logcat -b crash -d`，
        把含 `app.timbre.audiobook` 的部分贴进来。
        其他问题直接把截图拖进输入框即可。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issue，确认这不是重复反馈
          required: true
        - label: 我已确认使用的是最新版本
          required: true
