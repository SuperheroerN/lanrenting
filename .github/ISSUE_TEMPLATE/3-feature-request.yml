name: 功能建议
description: 想要的新功能、使用体验上的改进
title: "[建议] "
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议！说清「为什么需要」比只说「想要什么」更有价值。

        提交前建议先看看：
        - [常见问题](https://github.com/cq10086123/Timbre/blob/main/docs/faq.md)
        - [功能说明](https://github.com/cq10086123/Timbre/blob/main/docs/features.md)
        - [已有 Issue 里的同类建议](https://github.com/cq10086123/Timbre/issues?q=is%3Aissue)，可以到那里一起讨论

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述使用场景和当前遇到的麻烦，而不是直接给方案
      placeholder: |
        例如：我主要在开车时听书，想切下一章得单手点屏幕三次，很不方便。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望 Timbre 怎么做？
      placeholder: |
        例如：希望支持长按音量键切换章节，或者能在设置里自定义耳机按键行为。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 现在你是怎么绕过这个问题的？有没有其他做法能达到类似效果？
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: 涉及功能
      description: 这个建议主要关于哪一块？
      options:
        - 本地文件（导入 / 扫描 / 书架）
        - 播放（进度 / 后台播放 / 通知栏）
        - WebDAV 或 NAS 在线播放
        - 在线书源
        - 自定义接口源（.jdr 扩展包）
        - 下载与缓存
        - 界面 / 主题 / 语言
        - 其他
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: 是否愿意自己实现并提交 PR
      options:
        - 愿意，我可以直接提 PR
        - 愿意，但需要一点指路
        - 只提建议，暂时没有精力
    validations:
      required: false
